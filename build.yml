            if(tool==1){for(int i=0;i<32;i++)box(ringPt(a,i),V{th*2,th*2,th*2},k);}
            else{V sc{th,th,th};(&sc.x)[a]=L;box(p+AX[a]*(L*.5f),sc,k);float e=th*(tool==2?7.f:4.f);box(p+AX[a]*L,V{e,e,e},k);}}}
          struct ND{float x,y,z;int a;bool pos;};
