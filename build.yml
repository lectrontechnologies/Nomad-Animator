          void frame(){
           if(screen==HOME){drawHome();eglSwapBuffers(dpy,surf);return;}
           glViewport(0,0,W,H);glClearColor(.18f,.19f,.22f,1);glClear(GL_COLOR_BUFFER_BIT|GL_DEPTH_BUFFER_BIT);

